name: Release

on:
  push:
    tags:
      - "v*-sgh.*"

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Code checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version: "1.25.14"

      - name: Verify source
        run: |
          files="$(gofmt -l .)"
          if [ -n "${files}" ]; then
            echo "The following files are not formatted:"
            echo "${files}"
            exit 1
          fi
          go vet ./...
          go test -race ./...

      - name: Build release binaries
        env:
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          VERSION="${VERSION#v}"
          GOARCH=amd64 go build -o dist/wings_linux_amd64 -v -trimpath -ldflags="-s -w -X github.com/pterodactyl/wings/system.Version=${VERSION}" github.com/pterodactyl/wings
          chmod 755 dist/wings_linux_amd64
          GOARCH=arm64 go build -o dist/wings_linux_arm64 -v -trimpath -ldflags="-s -w -X github.com/pterodactyl/wings/system.Version=${VERSION}" github.com/pterodactyl/wings
          chmod 755 dist/wings_linux_arm64

      - name: Create checksums.txt
        run: |
          (cd dist && sha256sum wings_linux_amd64 wings_linux_arm64) > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          generate_release_notes: true
          files: |
            dist/*
            checksums.txt
