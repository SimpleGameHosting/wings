name: govulncheck

on:
  schedule:
    - cron: "43 6 * * 1"
  push:
    branches: [sgh]
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.7"
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
